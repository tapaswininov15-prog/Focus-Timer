*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#000;color:#fff;overflow:hidden;user-select:none;-webkit-user-select:none;font-family:"Courier New",Courier,monospace}
body{display:flex;flex-direction:column}
canvas{flex:1;width:100%;min-height:0;display:block}
.ctl{padding:6px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:12px}
.row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
button{background:transparent;color:#fff;border:1px solid #3a3a3a;border-radius:999px;padding:11px 20px;font:13px "Courier New",Courier,monospace;letter-spacing:.14em;text-transform:uppercase}
button:active{background:#1c1c1c}
button.go{background:#d71921;border-color:#d71921;padding:13px 34px}
button.go:active{background:#a81218}
.modes button{border:0;color:#6b6b6b;padding:6px 10px;font-size:12px}
.modes button.on{color:#fff}
.modes button.on::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#d71921;margin-right:8px;vertical-align:1px}
.set{display:none;gap:14px;color:#6b6b6b;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.set.open{display:flex}
.set label{display:flex;flex-direction:column;align-items:center;gap:6px}
.set input{width:58px;background:#000;color:#fff;border:1px solid #3a3a3a;border-radius:10px;font:15px "Courier New",Courier,monospace;text-align:center;padding:8px 0}
.small button{padding:8px 14px;font-size:11px;color:#8a8a8a}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="ctl">
  <div class="row modes" id="modes">
    <button data-m="focus" class="on">focus</button>
    <button data-m="short">short</button>
    <button data-m="long">long</button>
  </div>
  <div class="row">
    <button id="reset">reset</button>
    <button class="go" id="go">start</button>
    <button id="skip">skip</button>
  </div>
  <div class="row small">
    <button id="gear">set</button>
    <button id="full">full</button>
  </div>
  <div class="set" id="set">
    <label>focus<input type="number" min="1" max="99" id="d-focus"></label>
    <label>short<input type="number" min="1" max="99" id="d-short"></label>
    <label>long<input type="number" min="1" max="99" id="d-long"></label>
  </div>
</div>
<script>
(function(){
  var RED = '#d71921', ON = '#ffffff', DIM = 'rgba(255,255,255,0.11)', MUTE = '#7a7a7a';
  var F = {
    '0':['01110','10001','10011','10101','11001','10001','01110'],
    '1':['00100','01100','00100','00100','00100','00100','01110'],
    '2':['01110','10001','00001','00010','00100','01000','11111'],
    '3':['11111','00010','00100','00010','00001','10001','01110'],
    '4':['00010','00110','01010','10010','11111','00010','00010'],
    '5':['11111','10000','11110','00001','00001','10001','01110'],
    '6':['00110','01000','10000','11110','10001','10001','01110'],
    '7':['11111','00001','00010','00100','01000','01000','01000'],
    '8':['01110','10001','10001','01110','10001','10001','01110'],
    '9':['01110','10001','10001','01111','00001','00010','01100'],
    ':':['0','0','1','0','1','0','0']
  };
  var cv = document.getElementById('cv'), g = cv.getContext('2d');
  var W = 0, H = 0, dpr = window.devicePixelRatio || 1;
  var dur = {focus:25, short:5, long:15};
  try { var s = JSON.parse(localStorage.getItem('pomo-dot')); if (s && s.focus) dur = s; } catch(e){}
  var mode = 'focus', remaining = dur.focus * 60000, running = false, endAt = 0, done = 0, flashUntil = 0, wake = null, ctx = null;
  var $ = function(id){ return document.getElementById(id); };
  var pad = function(n){ return (n < 10 ? '0' : '') + n; };

  function resize(){
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }
  function dot(x, y, r, c){ g.beginPath(); g.arc(x, y, r, 0, 6.2832); g.fillStyle = c; g.fill(); }
  function textCols(str){
    var n = 0;
    for (var i = 0; i < str.length; i++) n += F[str[i]][0].length + (i ? 1 : 0);
    return n;
  }
  function drawText(str, cx, cy, cell, color, faint){
    var cols = textCols(str), x0 = cx - (cols - 1) * cell / 2, y0 = cy - 3 * cell, x = x0, r = cell * 0.4;
    for (var i = 0; i < str.length; i++) {
      var gl = F[str[i]];
      for (var row = 0; row < 7; row++) {
        for (var c = 0; c < gl[row].length; c++) {
          if (gl[row][c] === '1') dot(x + c * cell, y0 + row * cell, r, color);
          else if (faint) dot(x + c * cell, y0 + row * cell, r * 0.8, DIM);
        }
      }
      x += (gl[0].length + 1) * cell;
    }
  }
  function drawNum(str, cx, cy, h, color){
    var fs = h / 0.6545;
    g.font = fs + 'px D7M, "Courier New", monospace';
    g.textAlign = 'center'; g.textBaseline = 'alphabetic'; g.fillStyle = color;
    g.fillText(str, cx, cy + h / 2);
  }
  var SEG = {'0':'abcdef','1':'bc','2':'abdeg','3':'abcdg','4':'bcfg','5':'acdfg','6':'acdefg','7':'abc','8':'abcdefg','9':'abcdfg'};
  function poly(p, c){
    g.beginPath(); g.moveTo(p[0][0], p[0][1]);
    for (var i = 1; i < p.length; i++) g.lineTo(p[i][0], p[i][1]);
    g.closePath(); g.fillStyle = c; g.fill();
  }
  function drawSeg(str, cx, cy, h, color, faint){
    var w = h * 0.56, t = h * 0.13, gap = t * 1.5, cw = t, gp = t * 0.15, n = 0, i;
    for (i = 0; i < str.length; i++) n += (str[i] === ':' ? cw : w) + (i ? gap : 0);
    var x = cx - n / 2, y = cy - h / 2;
    function hs(x1, x2, yc, c){ poly([[x1, yc], [x1 + t / 2, yc - t / 2], [x2 - t / 2, yc - t / 2], [x2, yc], [x2 - t / 2, yc + t / 2], [x1 + t / 2, yc + t / 2]], c); }
    function vs(y1, y2, xc, c){ poly([[xc, y1], [xc + t / 2, y1 + t / 2], [xc + t / 2, y2 - t / 2], [xc, y2], [xc - t / 2, y2 - t / 2], [xc - t / 2, y1 + t / 2]], c); }
    for (i = 0; i < str.length; i++) {
      var ch = str[i];
      if (ch === ':') {
        g.fillStyle = color;
        g.fillRect(x, y + h * 0.3 - t / 2, t, t);
        g.fillRect(x, y + h * 0.7 - t / 2, t, t);
        x += cw + gap; continue;
      }
      var xl = x + t / 2, xr = x + w - t / 2, yt = y + t / 2, ym = y + h / 2, yb = y + h - t / 2;
      var a = xl + t / 2 + gp, b = xr - t / 2 - gp, on = SEG[ch], off = 'rgba(255,255,255,0.07)';
      var parts = {
        a: function(c){ hs(a, b, yt, c); }, g: function(c){ hs(a, b, ym, c); }, d: function(c){ hs(a, b, yb, c); },
        f: function(c){ vs(yt + t / 2 + gp, ym - t / 2 - gp, xl, c); }, b: function(c){ vs(yt + t / 2 + gp, ym - t / 2 - gp, xr, c); },
        e: function(c){ vs(ym + t / 2 + gp, yb - t / 2 - gp, xl, c); }, c: function(c){ vs(ym + t / 2 + gp, yb - t / 2 - gp, xr, c); }
      };
      for (var k in parts) {
        if (on.indexOf(k) >= 0) parts[k](color);
        else if (faint) parts[k](off);
      }
      x += w + gap;
    }
  }
  function draw(){
    if (!W) return;
    var now = new Date();
    var total = dur[mode] * 60000;
    if (running) remaining = Math.max(0, endAt - Date.now());
    var secs = Math.ceil(remaining / 1000);
    var t = pad(Math.floor(secs / 60)) + ':' + pad(secs % 60);
    document.title = t;
    g.clearRect(0, 0, W, H);

    var cell0 = Math.max(4, Math.min(W * 0.016, 7));
    var topH = cell0 * 9 + 16;
    drawNum(pad(now.getHours()) + ':' + pad(now.getMinutes()), W / 2, topH / 2 + 6, cell0 * 7, MUTE);

    var avail = Math.min(W - 24, H - topH - 8);
    var R = avail / 2 - 6, cx = W / 2, cy = topH + (H - topH) / 2;
    var N = 60, lit = Math.ceil(remaining / total * N), flash = Date.now() < flashUntil && Math.floor(Date.now() / 300) % 2 === 0;
    var rd = Math.max(2, R * 0.03);
    for (var i = 0; i < N; i++) {
      var a = -Math.PI / 2 + i / N * 6.2832;
      var c = i < lit ? (i === lit - 1 ? RED : ON) : DIM;
      if (flash) c = RED;
      dot(cx + Math.cos(a) * R, cy + Math.sin(a) * R, i === lit - 1 ? rd * 1.5 : rd, c);
    }
    var cell = R * 1.46 / 25;
    drawNum(t, cx, cy - cell * 0.5, R * 0.42, ON);
    var py = cy + cell * 6, done4 = done % 4;
    if (done > 0 && done4 === 0 && mode === 'long') done4 = 4;
    for (var k = 0; k < 4; k++) dot(cx + (k - 1.5) * cell * 2.2, py, cell * 0.4, k < done4 ? RED : DIM);

    $('go').textContent = running ? 'pause' : 'start';
    if (running && remaining <= 0) finish();
  }
  function setMode(m){
    mode = m; running = false; remaining = dur[m] * 60000;
    var b = document.querySelectorAll('#modes button');
    for (var i = 0; i < b.length; i++) b[i].className = b[i].getAttribute('data-m') === m ? 'on' : '';
    draw();
  }
  function beep(){
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      [0, 0.22, 0.44].forEach(function(d){
        var o = ctx.createOscillator(), gn = ctx.createGain(), t0 = ctx.currentTime + d;
        o.type = 'square'; o.frequency.value = 1320; o.connect(gn); gn.connect(ctx.destination);
        gn.gain.setValueAtTime(0.0001, t0);
        gn.gain.exponentialRampToValueAtTime(0.12, t0 + 0.01);
        gn.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.12);
        o.start(t0); o.stop(t0 + 0.14);
      });
    } catch(e){}
    try { if (navigator.vibrate) navigator.vibrate([150, 80, 150]); } catch(e){}
  }
  function advance(){
    if (mode === 'focus') { done++; setMode(done % 4 === 0 ? 'long' : 'short'); }
    else setMode('focus');
  }
  function finish(){ running = false; beep(); flashUntil = Date.now() + 2400; advance(); }
  function keepAwake(){
    try {
      if (navigator.wakeLock && !wake) {
        navigator.wakeLock.request('screen').then(function(l){
          wake = l; l.addEventListener('release', function(){ wake = null; });
        }).catch(function(){});
      }
    } catch(e){}
  }
  $('go').onclick = function(){
    if (running) running = false;
    else { if (remaining <= 0) remaining = dur[mode] * 60000; endAt = Date.now() + remaining; running = true; }
    try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); if (ctx.resume) ctx.resume(); } catch(e){}
    keepAwake(); draw();
  };
  $('reset').onclick = function(){ setMode(mode); };
  $('skip').onclick = advance;
  $('modes').onclick = function(e){ var m = e.target.getAttribute('data-m'); if (m) setMode(m); };
  $('gear').onclick = function(){ $('set').classList.toggle('open'); resize(); };
  $('full').onclick = function(){
    var el = document.documentElement;
    try {
      if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
    } catch(e){}
    keepAwake();
  };
  ['focus', 'short', 'long'].forEach(function(k){
    var inp = $('d-' + k); inp.value = dur[k];
    inp.onchange = function(){
      var v = Math.max(1, Math.min(99, parseInt(inp.value, 10) || dur[k]));
      dur[k] = v; inp.value = v;
      try { localStorage.setItem('pomo-dot', JSON.stringify(dur)); } catch(e){}
      if (!running && mode === k) setMode(k);
    };
  });
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) { wake = null; keepAwake(); draw(); } });
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function(){ setTimeout(resize, 200); });
  resize();
  setInterval(draw, 250);
  try { document.fonts.load('40px D7M').then(draw); } catch(e){}
})();
</script>
</body>
</html>
